const filters = { cat: "전체", imp: "전체", region: "전체" };

function setFilter(type, val, btn) {
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => {
    b.className = "filter-btn";
    if (b.dataset.val === val) {
      if (type === "cat" && val === "E") b.classList.add("active-e");
      else if (type === "cat" && val === "S") b.classList.add("active-s");
      else if (type === "cat" && val === "G") b.classList.add("active-g");
      else b.classList.add("active");
    }
  });
  renderTable();
}

function getFiltered() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  return NEWS_DATA.filter(d => {
    if (filters.cat !== "전체" && d.category !== filters.cat) return false;
    if (filters.imp !== "전체" && d.importance !== filters.imp) return false;
    if (filters.region !== "전체" && d.region !== filters.region) return false;
    if (q && !`${d.title} ${d.companies} ${d.summary} ${d.implication}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));
}

function renderTable() {
  const rows = getFiltered();
  const body = document.getElementById("tableBody");
  document.getElementById("resultCount").textContent = `${rows.length}몱</button>
    b.classList.add("active-g");
    b.classList.add("active-s");
    b.classList.add("active-e");
    if (!rows.length) {
    body.innerHTML = `<tr><td colspan="8" class="no-result">조건에 맞는 뉴스가 없습니다.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(d => `
    <tr>
      <td class="date-cell">${d.date}</td>
      <td><span class="cat-badge cat-${d.category}">${d.category}</span></td>
      <td><span class="region-tag">${d.region}</span></td>
      <td><a class="title-link" href="${d.url}" target="_blank">${d.title}</a></td>
      <td>${d.summary}</td>
      <td>${d.implication}</td>
      <td style="font-size:11px">${d.companies}</td>
      <td><span class="imp-${d.importance}">${d.importance}</span></td>
    </tr>`).join("");
}

function renderStats() {
  const total = NEWS_DATA.length;
  const e = NEWS_DATA.filter(d => d.category === "E").length;
  const s = NEWS_DATA.filter(d => d.category === "S").length;
  const g = NEWS_DATA.filter(d => d.category === "G").length;
  const dates = [...new Set(NEWS_DATA.map(d => d.date))].sort();
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-chip"><span class="dot dot-all"></span>전체 ${total}건</div>
    <div class="stat-chip"><span class="dot dot-e"></span>E ${e}건</div>
    <div class="stat-chip"><span class="dot dot-s"></span>S ${s}건</div>
    <div class="stat-chip"><span class="dot dot-g"></span>G ${g}건</div>
    <div class="stat-chip" style="margin-left:auto;background:none;color:#888;font-size:11px">수집 기간: ${dates[0]} ~ ${dates[dates.length-1]}</div>`;
  const latest = dates[dates.length - 1];
  document.getElementById("lastUpdated").textContent = `최근 업데이트: ${latest}`;
}

renderStats();
renderTable();
</script>
