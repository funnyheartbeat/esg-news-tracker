<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG 뉴스 트래커</title>
<style>
  :root{color-scheme:light}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f4f6f9;color:#222;font-size:13px}.header{background:#1F3864;color:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}.header .sub{font-size:11px;opacity:.7;margin-top:2px}.stats{display:flex;gap:10px;padding:12px 20px;background:white;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}.stat-chip{display:flex;align-items:center;gap:6px;background:#f5f5f5;border-radius:20px;padding:4px 12px;font-size:12px}.stat-chip .dot{width:8px;height:8px;border-radius:50%}.dot-e{background:#52C41A}.dot-s{background:#1677FF}.dot-g{background:#FAAD14}.dot-all{background:#1F3864}.filters{padding:12px 20px;background:white;border-bottom:1px solid #e5e7eb;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.filter-group{display:flex;align-items:center;gap:6px}.filter-label{font-size:11px;color:#888;font-weight:600;min-width:42px}.filter-btn{border:1px solid #d9d9d9;background:white;border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;transition:all .15s}.filter-btn.active{background:#1F3864;color:white;border-color:#1F3864}.filter-btn.active-e{background:#52C41A;border-color:#52C41A;color:white}.filter-btn.active-s{background:#1677FF;border-color:#1677FF;color:white}.filter-btn.active-g{background:#FAAD14;border-color:#FAAD14;color:#333}.search-input{border:1px solid #d9d9d9;border-radius:4px;padding:4px 10px;font-size:12px;width:200px;outline:none}.result-count{margin-left:auto;font-size:11px;color:#888}.table-wrap{padding:12px 20px;overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}th{background:#1F3864;color:white;padding:9px 10px;text-align:left;font-size:11px;font-weight:600;white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top;font-size:12px;line-height:1.5}tr:last-child td{border-bottom:none}tr:hover td{background:#fafafa}.cat-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-weight:700;font-size:11px}.cat-E{background:#F6FFED;color:#389E0D;border:1px solid #B7EB8F}.cat-S{background:#E6F4FF;color:#0958D9;border:1px solid #91CAFF}.cat-G{background:#FFFBE6;color:#D48806;border:1px solid #FFE58F}.imp-상{color:#CF1322;font-weight:700}.imp-중{color:#D46B08}.imp-하{color:#595959}.region-tag{font-size:10px;color:#888;background:#f5f5f5;border-radius:3px;padding:1px 5px}.title-link{color:#1F3864;text-decoration:none;font-weight:600}.title-link:hover{text-decoration:underline}.no-result{text-align:center;color:#bbb;padding:40px}.date-cell{white-space:nowrap;font-size:11px;color:#888}
</style>
</head>
<body>
<div class="header"><div><div style="font-size:16px;font-weight:700">📊 ESG 뉴스 트래커</div><div class="sub">날짜 · 카테고리 · 중요도 · 기업명으로 조회</div></div><div id="lastUpdated" style="font-size:11px;opacity:.7;"></div></div>
<div class="stats" id="statsBar"></div>
<div class="filters">
  <div class="filter-group"><span class="filter-label">카테고리</span><button class="filter-btn active" data-filter="cat" data-val="전체" onclick="setFilter('cat','전체',this)">전체</button><button class="filter-btn" data-filter="cat" data-val="E" onclick="setFilter('cat','E',this)">E 환경</button><button class="filter-btn" data-filter="cat" data-val="S" onclick="setFilter('cat','S',this)">S 사회</button><button class="filter-btn" data-filter="cat" data-val="G" onclick="setFilter('cat','G',this)">G 거버넌스</button></div>
  <div class="filter-group"><span class="filter-label">중요도</span><button class="filter-btn active" data-filter="imp" data-val="전체" onclick="setFilter('imp','전체',this)">전체</button><button class="filter-btn" data-filter="imp" data-val="상" onclick="setFilter('imp','상',this)">상</button><button class="filter-btn" data-filter="imp" data-val="중" onclick="setFilter('imp','중',this)">중</button><button class="filter-btn" data-filter="imp" data-val="하" onclick="setFilter('imp','하',this)">하</button></div>
  <div class="filter-group"><span class="filter-label">지역</span><button class="filter-btn active" data-filter="region" data-val="전체" onclick="setFilter('region','전체',this)">전체</button><button class="filter-btn" data-filter="region" data-val="국내" onclick="setFilter('region','국내',this)">국내</button><button class="filter-btn" data-filter="region" data-val="해외" onclick="setFilter('region','해외',this)">해외</button></div>
  <div class="filter-group"><span class="filter-label">검색</span><input class="search-input" id="searchInput" placeholder="제목·기업명·내용 검색..." oninput="renderTable()"></div>
  <span class="result-count" id="resultCount"></span>
</div>
<div class="table-wrap"><table><thead><tr><th style="width:90px">날짜</th><th style="width:70px">카테고리</th><th style="width:55px">지역</th><th style="width:22%">뉴스 제목</th><th style="width:28%">주요 내용</th><th style="width:22%">함의점</th><th style="width:14%">관련 기업/기관</th><th style="width:55px">중요도</th></tr></thead><tbody id="tableBody"></tbody></table></div>
<script>
const NEWS_DATA=[{date:"2026-06-08",category:"G",region:"해외",title:"SpaceX IPO 앞두고 기관투자자 거버넌스 우려 표명",summary:"SpaceX가 6월 12일 나스닥 상장 예정인 가운데 Morningstar·덴마크 AkademikerPension 등 기관투자자가 이중주식구조·이사회 독립성 부재를 이유로 우려 표명. AkademikerPension은 블랙리스트 추가.",implication:"이중주식구조 기업에 대한 ESG 기관투자자 의결권 행사 기준 강화. 국내 오너 경영 기업 지배구조 평가 재점검 필요.",companies:"SpaceX, AkademikerPension, Morningstar",importance:"상",url:"https://www.esgdive.com/news/institutional-investors-spacex-ipo-governance-concerns-share-structure-board-composition/822254/"},{date:"2026-06-08",category:"G",region:"해외",title:"GRI, 오염 공시 기준 초안 의견수렴 마감",summary:"GRI 대기오염·토양오염·중대사고 공시 기준 초안 의견수렴 6월 8일 마감. 최종 기준 2027년 발표 예정.",implication:"기업 오염 공시 범위 확대 예고. CSRD·ISSB 연계 강화로 글로벌 오염 공시 표준화 진전.",companies:"GRI, 글로벌 제조·화학 기업",importance:"중",url:"https://www.esgtoday.com/gri-releases-proposed-pollution-disclosure-standards/"},{date:"2026-06-08",category:"E",region:"해외",title:"TD Bank, Deep Sky와 10년 탄소제거 계약 체결",summary:"캐나다 TD Bank가 탄소포집 기업 Deep Sky와 10년간 18,000톤 직접공기포집 크레딧 구매 계약 체결.",implication:"주요 금융기관의 CDR 시장 참여 가속화. 탄소 크레딧 수요 확대 및 관련 기업 가치 상승 기대.",companies:"TD Bank, Deep Sky",importance:"상",url:"https://www.esgtoday.com/td-signs-10-year-carbon-removal-deal-with-deep-sky/"},{date:"2026-06-08",category:"E",region:"해외",title:"Waymo, 폐 EV 배터리 전력망 저장용 재활용",summary:"Alphabet 자회사 Waymo가 B2U와 협력해 폐 EV 배터리를 BESS로 재활용. 텍사스·캘리포니아 수백 MW 규모 배치 계획.",implication:"빅테크 순환경제 전략 구체화. EV 배터리 재활용 시장 성장 및 투자 기회 확대.",companies:"Alphabet, Waymo, B2U",importance:"중",url:"https://www.esgtoday.com/alphabets-waymo-to-repurpose-used-ev-batteries-for-grid-storage/"},{date:"2026-06-08",category:"E",region:"국내",title:"AI 데이터센터 환경비용 급증",summary:"AI 인프라 확산으로 데이터센터 냉각용 수자원·토지 환경비용 급증. AI 전력 소비 전년 대비 50% 증가.",implication:"AI 기업 ESG 환경 리스크 부각. 수자원·토지 공시 강화 압박 예상. 국내 데이터센터 규제 논의 본격화 가능성.",companies:"삼성전자, SK하이닉스, 네이버, 카카오",importance:"상",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15695"},{date:"2026-06-08",category:"E",region:"해외",title:"저탄소 투자, 중국 집중…미국 투자 동력 약화",summary:"글로벌 저탄소 산업 투자가 중국에 집중. 미국은 트럼프 정책 변화로 투자 실행력 약화. 미·중 격차 확대.",implication:"미국 IRA 축소 영향 본격화. 한국 기업의 미국 내 청정에너지 사업 리스크 점검 필요.",companies:"미·중 청정에너지 기업 전반",importance:"상",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15698"},{date:"2026-06-08",category:"E",region:"해외",title:"일본, 원자로 최대 14기 교체 추진",summary:"일본 정부, 노후 원전 폐쇄 대신 최대 14기 신형 원자로 교체 계획 발표. 탄소중립을 위한 원자력 의존도 유지 전략.",implication:"원자력 탄소중립 수단 재부상. 국내 원전 수출 기회 긍정적. 원전 ESG 평가 기준 재정립 논의 주목.",companies:"일본 전력사, 두산에너빌리티",importance:"중",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15696"},{date:"2026-06-08",category:"E",region:"해외",title:"생물다양성 손실, 국가 신용등급 하락 요인으로 부상",summary:"글로벌 금융시장이 생물다양성 손실 리스크를 저평가한다는 연구 발표. 생물다양성 손실이 국가 신용등급에 영향 가능.",implication:"TNFD 공시 기준 도입 가속화 예상. 자연자본 리스크 평가가 ESG 투자 필수 항목으로 부상.",companies:"글로벌 금융기관, 자연자원 의존 기업",importance:"중",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15700"},{date:"2026-06-08",category:"S",region:"해외",title:"네슬레-ILO, 커피 공급망 인권 개선 프로젝트 출범",summary:"Nestlé와 ILO가 브라질·콜롬비아·멕시코 커피 공급망 노동권 보호를 위한 2년 프로젝트 체결.",implication:"EU CSDDD 대응 선제적 조치 사례. 국내 수출 대기업도 공급망 인권 리스크 관리 강화 요구 증대.",companies:"Nestlé, ILO",importance:"중",url:"https://www.esgdive.com/news/nestle-ilo-ink-partnership-to-support-labor-rights-in-coffee-supply-chains/816495/"},{date:"2026-06-08",category:"G",region:"해외",title:"영국 FCA, TCFD 기반 기후보고 폐지 제안",summary:"영국 FCA가 투자상품 대상 TCFD 기반 기후 공시 요건 폐지 제안. ISSB 기준으로 통합 가능성 시사.",implication:"글로벌 ESG 공시 기준 통합(TCFD→ISSB) 가속화 신호. 한국 금융당국 공시 로드맵에도 영향 가능성.",companies:"영국 자산운용사, 글로벌 투자기관",importance:"상",url:"https://www.esgtoday.com/uk-proposes-dropping-tcfd-based-climate-reporting-for-investment-products/"},{date:"2026-06-08",category:"G",region:"국내",title:"정용진, 13년 만에 이마트 등기이사 복귀",summary:"정용진 신세계 회장이 13년 만에 이마트 등기이사로 복귀. 실적 부진에 따른 오너 직접 경영 전면 나섬.",implication:"오너 경영 강화가 이사회 독립성에 미치는 영향 주목. 지배구조 개선 요구와의 충돌 가능성 검토 필요.",companies:"이마트, 신세계그룹",importance:"중",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15701"},{date:"2026-06-08",category:"G",region:"국내",title:"금융위, ESG 공시 로드맵 이달 발표 목표",summary:"금융위원회가 국내 ESG 지속가능성 공시 로드맵을 6월 내 발표할 계획. ISSB 기반 의무화 일정 확정 임박.",implication:"국내 대형 상장사의 ESG 공시 준비 본격화 신호. 공시 인프라 투자 및 제3자 검증 수요 급증 예상.",companies:"코스피 대형 상장사 전반",importance:"상",url:"https://www.esgeconomy.com/news/articleView.html?idxno=15707"}];
const filters={cat:"전체",imp:"전체",region:"전체"};
function setFilter(t,v,b){filters[t]=v;document.querySelectorAll('[data-filter="'+t+'"]').forEach(x=>{x.className="filter-btn";if(x.dataset.val===v){if(t==="cat"&&v==="E")x.classList.add("active-e");else if(t==="cat"&&v==="S")x.classList.add("active-s");else if(t==="cat"&&v==="G")x.classList.add("active-g");else x.classList.add("active");}});renderTable();}
function getFiltered(){const q=document.getElementById("searchInput").value.trim().toLowerCase();return NEWS_DATA.filter(d=>{if(filters.cat!=="전체"&&d.category!==filters.cat)return false;if(filters.imp!=="전체"&&d.importance!==filters.imp)return false;if(filters.region!=="전체"&&d.region!==filters.region)return false;if(q&&!(d.title+" "+d.companies+" "+d.summary+" "+d.implication).toLowerCase().includes(q))return false;return true;}).sort((a,b)=>b.date.localeCompare(a.date));}
function renderTable(){const rows=getFiltered();const body=document.getElementById("tableBody");document.getElementById("resultCount").textContent=rows.length+"건";if(!rows.length){body.innerHTML='<tr><td colspan="8" class="no-result">조건에 맞는 뉴스가 없습니다.</td></tr>';return;}body.innerHTML=rows.map(d=>'<tr><td class="date-cell">'+d.date+'</td><td><span class="cat-badge cat-'+d.category+'">'+d.category+'</span></td><td><span class="region-tag">'+d.region+'</span></td><td><a class="title-link" href="'+d.url+'" target="_blank">'+d.title+'</a></td><td>'+d.summary+'</td><td>'+d.implication+'</td><td style="font-size:11px">'+d.companies+'</td><td><span class="imp-'+d.importance+'">'+d.importance+'</span></td></tr>').join("");}
function renderStats(){const total=NEWS_DATA.length;const e=NEWS_DATA.filter(d=>d.category==="E").length;const s=NEWS_DATA.filter(d=>d.category==="S").length;const g=NEWS_DATA.filter(d=>d.category==="G").length;const dates=[...new Set(NEWS_DATA.map(d=>d.date))].sort();document.getElementById("statsBar").innerHTML='<div class="stat-chip"><span class="dot dot-all"></span>전체 '+total+'건</div><div class="stat-chip"><span class="dot dot-e"></span>E '+e+'건</div><div class="stat-chip"><span class="dot dot-s"></span>S '+s+'건</div><div class="stat-chip"><span class="dot dot-g"></span>G '+g+'건</div><div class="stat-chip" style="margin-left:auto;background:none;color:#888;font-size:11px">수집 기간: '+dates[0]+' ~ '+dates[dates.length-1]+'</div>';document.getElementById("lastUpdated").textContent="최근 업데이트: "+dates[dates.length-1];}
renderStats();renderTable();
</script>
</body>
</html>
