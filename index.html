<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG 뉴스 인사이트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --navy:#1f3a63; --navy2:#274b80; --line:#e3e6ea; --muted:#6b7280;
    --e-bg:#e6f4ea; --e-fg:#137333; --s-bg:#e8f0fe; --s-fg:#1967d2; --g-bg:#fef7e0; --g-fg:#b06000;
    --hi:#d93025; --mi:#f29900; --lo:#5f6368;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color:#202124;background:#f5f6f8}
  header{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:flex-start}
  header h1{margin:0;font-size:22px}
  header .sub{font-size:13px;opacity:.85;margin-top:4px}
  header .upd{text-align:right;font-size:13px;opacity:.9}
  header .upd a{color:#cfe0ff;text-decoration:none}
  .wrap{max-width:1500px;margin:0 auto;padding:0 24px}
  .stats{display:flex;gap:10px;align-items:center;padding:18px 0 6px;flex-wrap:wrap}
  .chip{background:#eef1f5;border:none;border-radius:18px;padding:6px 14px;font-size:13px;color:#374151;cursor:default;display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .stats .right{margin-left:auto;color:var(--muted);font-size:13px}
  .filters{display:flex;gap:8px;align-items:center;padding:14px 0;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px}
  .filters .label{font-size:13px;color:#374151;margin:0 2px 0 8px}
  .filters .label:first-child{margin-left:0}
  .fbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:#374151;cursor:pointer}
  .fbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .filters input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;min-width:220px}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .tablecard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 40px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{background:var(--navy);color:#fff;text-align:left;padding:12px 14px;font-weight:600;white-space:nowrap}
  tbody td{padding:14px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
  tbody tr:hover{background:#fafbfc}
  td.date{white-space:nowrap;color:#374151}
  td.title a{color:var(--navy);font-weight:700;text-decoration:none}
  td.title a:hover{text-decoration:underline}
  td.summary{color:#3c4043;max-width:340px}
  td.impl{color:#5f6368;max-width:300px}
  td.comp{color:#5f6368;max-width:170px}
  .cat{display:inline-block;min-width:22px;text-align:center;font-weight:700;border-radius:6px;padding:2px 8px}
  .cat.E{background:var(--e-bg);color:var(--e-fg)} .cat.S{background:var(--s-bg);color:var(--s-fg)} .cat.G{background:var(--g-bg);color:var(--g-fg)}
  .region{font-size:12px;color:#6b7280;background:#f1f3f4;border-radius:5px;padding:2px 7px;white-space:nowrap}
  .imp{font-weight:700} .imp.상{color:var(--hi)} .imp.중{color:var(--mi)} .imp.하{color:var(--lo)}
  .state{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>📊 ESG 뉴스 인사이트</h1>
    <div class="sub">규제 동향 · 기관투자자 동향 · 기업 뉴스 · 인사이트</div>
  </div>
  <div class="upd">
    최근 업데이트: <span id="lastUpdate">—</span><br>
    <a id="editLink" href="#" target="_blank">📝 Google Sheets 편집</a>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <span class="chip"><span class="dot" style="background:#374151"></span>전체 <b id="cAll">0</b>건</span>
    <span class="chip"><span class="dot" style="background:var(--e-fg)"></span>E <b id="cE">0</b>건</span>
    <span class="chip"><span class="dot" style="background:var(--s-fg)"></span>S <b id="cS">0</b>건</span>
    <span class="chip"><span class="dot" style="background:var(--g-fg)"></span>G <b id="cG">0</b>건</span>
    <span class="right">수집 기간: <span id="range">—</span></span>
  </div>

  <div class="filters">
    <span class="label">카테고리</span>
    <button class="fbtn active" data-f="cat" data-v="">전체</button>
    <button class="fbtn" data-f="cat" data-v="E">E 환경</button>
    <button class="fbtn" data-f="cat" data-v="S">S 사회</button>
    <button class="fbtn" data-f="cat" data-v="G">G 거버넌스</button>
    <span class="label">중요도</span>
    <button class="fbtn active" data-f="imp" data-v="">전체</button>
    <button class="fbtn" data-f="imp" data-v="상">상</button>
    <button class="fbtn" data-f="imp" data-v="중">중</button>
    <button class="fbtn" data-f="imp" data-v="하">하</button>
    <span class="label">지역</span>
    <button class="fbtn active" data-f="region" data-v="">전체</button>
    <button class="fbtn" data-f="region" data-v="국내">국내</button>
    <button class="fbtn" data-f="region" data-v="해외">해외</button>
    <span class="label">검색</span>
    <input type="text" id="q" placeholder="제목·기업명·내용 검색...">
    <span class="count"><b id="shown">0</b>건</span>
  </div>

  <div class="tablecard">
    <table>
      <thead><tr>
        <th>날짜</th><th>카테고리</th><th>지역</th><th>뉴스 제목</th>
        <th>주요 내용</th><th>함의점</th><th>관련 기업/기관</th><th>중요도</th>
      </tr></thead>
      <tbody id="rows"><tr><td class="state" colspan="8">불러오는 중…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
/* ===== 설정 ===== */
/* 캐노니컬 시트 ID. Apps Script append 방식에서 이 ID는 고정됩니다. */
const SHEET_ID = "1OPeL9VN6kmalit448EPjO-ke2Ql0RoWzWVwqnXrUV48";
/* gviz CSV 엔드포인트: 시트가 '링크가 있는 모든 사용자 - 뷰어'로 공유돼 있으면 동작.
   ('웹에 게시'가 따로 필요 없어 더 안정적입니다.) */
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
const EDIT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

let DATA = [];
const filters = { cat:"", imp:"", region:"" };
let query = "";

document.getElementById("editLink").href = EDIT_URL;

function esc(s){ return (s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

function load(){
  Papa.parse(CSV_URL, {
    download:true, header:true, skipEmptyLines:true,
    complete:(res)=>{
      // 정상 CSV 파싱: 따옴표로 감싼 쉼표/줄바꿈을 올바르게 처리
      DATA = res.data
        .map(r=>({
          date:(r.date||"").trim(), category:(r.category||"").trim().toUpperCase(),
          region:(r.region||"").trim(), title:(r.title||"").trim(),
          summary:(r.summary||"").trim(), implication:(r.implication||"").trim(),
          companies:(r.companies||"").trim(), importance:(r.importance||"").trim(),
          url:(r.url||"").trim()
        }))
        .filter(r=>r.date && r.title)
        .sort((a,b)=> b.date.localeCompare(a.date)); // 최신순
      renderStats(); render();
    },
    error:(err)=>{
      document.getElementById("rows").innerHTML =
        `<tr><td class="state" colspan="8">데이터를 불러오지 못했습니다. 시트 공유 설정(링크가 있는 모든 사용자 · 뷰어)을 확인하세요.<br><small>${esc(err&&err.message||"")}</small></td></tr>`;
    }
  });
}

function renderStats(){
  const n=c=>DATA.filter(r=>r.category===c).length;
  document.getElementById("cAll").textContent=DATA.length;
  document.getElementById("cE").textContent=n("E");
  document.getElementById("cS").textContent=n("S");
  document.getElementById("cG").textContent=n("G");
  const dates=DATA.map(r=>r.date).filter(Boolean).sort();
  document.getElementById("range").textContent = dates.length? `${dates[0]} ~ ${dates[dates.length-1]}` : "—";
  document.getElementById("lastUpdate").textContent = dates.length? dates[dates.length-1] : "—";
}

function render(){
  const q=query.trim().toLowerCase();
  const list=DATA.filter(r=>{
    if(filters.cat && r.category!==filters.cat) return false;
    if(filters.imp && r.importance!==filters.imp) return false;
    if(filters.region && r.region!==filters.region) return false;
    if(q){
      const hay=(r.title+" "+r.summary+" "+r.implication+" "+r.companies).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById("shown").textContent=list.length;
  const tb=document.getElementById("rows");
  if(!list.length){ tb.innerHTML=`<tr><td class="state" colspan="8">조건에 맞는 뉴스가 없습니다.</td></tr>`; return; }
  tb.innerHTML=list.map(r=>{
    const cat=["E","S","G"].includes(r.category)?r.category:"E";
    const titleCell = r.url
      ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
      : esc(r.title);
    return `<tr>
      <td class="date">${esc(r.date)}</td>
      <td><span class="cat ${cat}">${esc(r.category)}</span></td>
      <td><span class="region">${esc(r.region)}</span></td>
      <td class="title">${titleCell}</td>
      <td class="summary">${esc(r.summary)}</td>
      <td class="impl">${esc(r.implication)}</td>
      <td class="comp">${esc(r.companies)}</td>
      <td><span class="imp ${esc(r.importance)}">${esc(r.importance)}</span></td>
    </tr>`;
  }).join("");
}

document.querySelectorAll(".fbtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const f=btn.dataset.f;
    document.querySelectorAll(`.fbtn[data-f="${f}"]`).forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    filters[f]=btn.dataset.v;
    render();
  });
});
document.getElementById("q").addEventListener("input",e=>{ query=e.target.value; render(); });

load();
</script>
</body>
</html>
