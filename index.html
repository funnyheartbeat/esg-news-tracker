<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESG 뉴스 트래커</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #222; font-size: 13px; }

  /* Header */
  .header { background: #1F3864; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .h1 { font-size: 16px; font-weight: 700; }
  .sub { font-size: 11px; opacity: 0.7; margin-top: 2px; }

  /* Stats bar */
  .stats { display: flex; gap: 10px; padding: 12px 20px; background: white; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .stat-chip { display: flex; align-items: center; gap: 6px; background: #f5f5f5; border-radius: 20px; padding: 4px 12px; font-size: 12px; }
  .stat-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-e { background: #52C41A; }
  .dot-s { background: #1677FF; }
  .dot-g { background: #FAAD14; }
  .dot-all { background: #1F3864; }

  /* Filter bar */
  .filters { padding: 12px 20px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .filter-label { font-size: 11px; color: #888; font-weight: 600; min-width: 42px; }
  .filter-btn { border: 1px solid #d9d9d9; background: white; border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; transition: all .15s; font-family: Arial; }
  .filter-btn:hover { border-color: #1F3864; color: #1F3864; }
  .filter-btn.active { background: #1F3864; color: white; border-color: #1F3864; }
  .filter-btn.active-e { background: #52C41A; border-color: #52C41A; color: white; }
  .filter-btn.active-s { background: #1677FF; border-color: #1677FF; color: white; }
  .filter-btn.active-g { background: #FAAD14; border-color: #FAAD14; color: #333; }
  .search-input { border: 1px solid #d9d9d9; border-radius: 4px; padding: 4px 10px; font-size: 12px; font-family: Arial; width: 200px; outline: none; }
  .search-input:focus { border-color: #1F3864; }
  .result-count { margin-left: auto; font-size: 11px; color: #888; }

  /* Table */
  .table-wrap { padding: 12px 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th { background: #1F3864; color: white; padding: 9px 10px; text-align: left; font-size: 11px; font-weight: 600; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; font-size: 12px; line-height: 1.5; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .cat-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 700; font-size: 11px; }
  .cat-E { background: #F6FFED; color: #389E0D; border: 1px solid #B7EB8F; }
  .cat-S { background: #E6F4FF; color: #0958D9; border: 1px solid #91CAFF; }
  .cat-G { background: #FFFBE6; color: #D48806; border: 1px solid #FFE58F; }
  .imp-상 { color: #CF1322; font-weight: 700; }
  .imp-중 { color: #D46B08; }
  .imp-하 { color: #595959; }
  .region-tag { font-size: 10px; color: #888; background: #f5f5f5; border-radius: 3px; padding: 1px 5px; }
  .title-link { color: #1F3864; text-decoration: none; font-weight: 600; }
  .title-link:hover { text-decoration: underline; }
  .no-result { text-align: center; color: #bbb; padding: 40px; font-size: 13px; }
  .date-cell { white-space: nowrap; font-size: 11px; color: #888; }

  /* Loading */
  .loading-bar { height: 3px; background: linear-gradient(90deg, #1F3864 30%, #52C41A 60%, #1677FF 100%); background-size: 200% 100%; animation: slide 1.2s linear infinite; }
  @keyframes slide { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  .error-msg { color: #CF1322; font-size: 12px; padding: 4px 8px; }
</style>
</head>
<body>

<div id="loadingBar" class="loading-bar"></div>

<div class="header">
  <div>
    <div class="h1">📊 ESG 뉴스 인사이트</div>
    <div class="sub">규제 동향 · 기관투자자 동향 · 기업 뉴스 · 인사이트</div>
  </div>
  <div style="text-align:right">
    <div id="lastUpdated" style="font-size:11px;opacity:.7;"></div>
    <div id="sheetLink" style="font-size:10px;margin-top:3px;"></div>
  </div>
</div>

<div class="stats" id="statsBar"><div class="stat-chip">데이터 로딩 중...</div></div>

<div class="filters">
  <div class="filter-group">
    <span class="filter-label">카테고리</span>
    <button class="filter-btn active" data-filter="cat" data-val="전체" onclick="setFilter('cat','전체',this)">전체</button>
    <button class="filter-btn" data-filter="cat" data-val="E" onclick="setFilter('cat','E',this)">E 환경</button>
    <button class="filter-btn" data-filter="cat" data-val="S" onclick="setFilter('cat','S',this)">S 사회</button>
    <button class="filter-btn" data-filter="cat" data-val="G" onclick="setFilter('cat','G',this)">G 거버넌스</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">중요도</span>
    <button class="filter-btn active" data-filter="imp" data-val="전체" onclick="setFilter('imp','전체',this)">전체</button>
    <button class="filter-btn" data-filter="imp" data-val="상" onclick="setFilter('imp','상',this)">상</button>
    <button class="filter-btn" data-filter="imp" data-val="중" onclick="setFilter('imp','중',this)">중</button>
    <button class="filter-btn" data-filter="imp" data-val="하" onclick="setFilter('imp','하',this)">하</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">지역</span>
    <button class="filter-btn active" data-filter="region" data-val="전체" onclick="setFilter('region','전체',this)">전체</button>
    <button class="filter-btn" data-filter="region" data-val="국내" onclick="setFilter('region','국내',this)">국내</button>
    <button class="filter-btn" data-filter="region" data-val="해외" onclick="setFilter('region','해외',this)">해외</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">검색</span>
    <input class="search-input" id="searchInput" placeholder="제목·기업명·내용 검색..." oninput="renderTable()">
  </div>
  <span class="result-count" id="resultCount"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:90px">날짜</th>
        <th style="width:70px">카테고리</th>
        <th style="width:55px">지역</th>
        <th style="width:22%">뉴스 제목</th>
        <th style="width:28%">주요 내용</th>
        <th style="width:22%">함의점</th>
        <th style="width:14%">관련 기업/기관</th>
        <th style="width:55px">중요도</th>
      </tr>
    </thead>
    <tbody id="tableBody"><tr><td colspan="8" class="no-result">데이터 로딩 중...</td></tr></tbody>
  </table>
</div>

<script>
// ── 데이터 소스: Google Sheets (웹에 게시된 CSV) ──────────────────
const SHEET_ID = '1OPeL9VN6kmalit448EPjO-ke2Ql0RoWzWVwqnXrUV48';
const CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqoO8j_aO2cva9TD5iTUQBgVAqgTfKtCj_XVekuWcuTOj44TrkdiY9h4FKMn3KOxXv6iQ67NjMItC/pub?gid=2019829128&single=true&output=csv';

let NEWS_DATA = [];
const filters = { cat: "전체", imp: "전체", region: "전체" };

// ── CSV 파서 (따옴표 포함 필드 처리) ─────────────────────────────
function parseCSV(text) {
  const results = [];
  const rows = [];
  let cur = '', inQ = false;
  const chars = [...text];
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    if (c === '"') {
      if (inQ && chars[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if ((c === '\n' || c === '\r') && !inQ) {
      rows.push(cur); cur = '';
      if (c === '\r' && chars[i+1] === '\n') i++;
    } else {
      cur += c;
    }
  }
  if (cur) rows.push(cur);

  for (const row of rows) {
    const fields = [];
    let f = '', inq = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') {
        if (inq && row[i+1] === '"') { f += '"'; i++; }
        else inq = !inq;
      } else if (c === ',' && !inq) {
        fields.push(f); f = '';
      } else {
        f += c;
      }
    }
    fields.push(f);
    results.push(fields);
  }
  return results;
}

// ── 데이터 로드 ────────────────────────────────────────────────
async function loadData() {
  const bar = document.getElementById('loadingBar');
  bar.style.display = 'block';
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);
    // 헤더: date,category,region,title,summary,implication,companies,importance,url
    NEWS_DATA = rows.slice(1)
      .filter(r => r.length >= 9 && r[0] && r[0].match(/^\d{4}-\d{2}-\d{2}$/))
      .map(r => ({
        date: r[0].trim(),
        category: r[1].trim(),
        region: r[2].trim(),
        title: r[3].trim(),
        summary: r[4].trim(),
        implication: r[5].trim(),
        companies: r[6].trim(),
        importance: r[7].trim(),
        url: r[8].trim()
      }));
    renderStats();
    renderTable();
    // 시트 링크 표시
    document.getElementById('sheetLink').innerHTML =
      `<a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" style="color:rgba(255,255,255,0.6);font-size:10px;">📄 Google Sheets 편집</a>`;
  } catch(e) {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="8" class="no-result" style="color:#CF1322;">
        데이터 로드 실패: ${e.message}<br>
        <small style="color:#888">Google Sheet를 '웹에 게시'했는지 확인해 주세요.<br>
        파일 → 공유 → 웹에 게시 → CSV 형식으로 게시</small>
      </td></tr>`;
    document.getElementById('statsBar').innerHTML = '<div class="stat-chip" style="color:#CF1322">⚠ 로드 실패</div>';
  } finally {
    bar.style.display = 'none';
  }
}

// ── 필터 & 렌더링 ─────────────────────────────────────────────
function setFilter(type, val, btn) {
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => {
    b.className = "filter-btn";
    if (b.dataset.val === val) {
      if (type === "cat" && val === "E") b.classList.add("active-e");
      else if (type === "cat" && val === "S") b.classList.add("active-s");
      else if (type === "cat" && val === "G") b.classList.add("active-g");
      else b.classList.add("active");
    }
  });
  renderTable();
}

function getFiltered() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  return NEWS_DATA.filter(d => {
    if (filters.cat !== "전체" && d.category !== filters.cat) return false;
    if (filters.imp !== "전체" && d.importance !== filters.imp) return false;
    if (filters.region !== "전체" && d.region !== filters.region) return false;
    if (q && !`${d.title} ${d.companies} ${d.summary} ${d.implication}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));
}

function renderTable() {
  const rows = getFiltered();
  const body = document.getElementById("tableBody");
  document.getElementById("resultCount").textContent = `${rows.length}건`;
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="8" class="no-result">조건에 맞는 뉴스가 없습니다.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(d => `
    <tr>
      <td class="date-cell">${d.date}</td>
      <td><span class="cat-badge cat-${d.category}">${d.category}</span></td>
      <td><span class="region-tag">${d.region}</span></td>
      <td><a class="title-link" href="${d.url}" target="_blank">${d.title}</a></td>
      <td>${d.summary}</td>
      <td>${d.implication}</td>
      <td style="font-size:11px">${d.companies}</td>
      <td><span class="imp-${d.importance}">${d.importance}</span></td>
    </tr>`).join("");
}

function renderStats() {
  const total = NEWS_DATA.length;
  const e = NEWS_DATA.filter(d => d.category === "E").length;
  const s = NEWS_DATA.filter(d => d.category === "S").length;
  const g = NEWS_DATA.filter(d => d.category === "G").length;
  const dates = [...new Set(NEWS_DATA.map(d => d.date))].sort();
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-chip"><span class="dot dot-all"></span>전체 ${total}건</div>
    <div class="stat-chip"><span class="dot dot-e"></span>E ${e}건</div>
    <div class="stat-chip"><span class="dot dot-s"></span>S ${s}건</div>
    <div class="stat-chip"><span class="dot dot-g"></span>G ${g}건</div>
    <div class="stat-chip" style="margin-left:auto;background:none;color:#888;font-size:11px">수집 기간: ${dates[0]} ~ ${dates[dates.length-1]}</div>`;
  document.getElementById("lastUpdated").textContent = `최근 업데이트: ${dates[dates.length - 1]}`;
}

loadData();
</script>
</body>
</html>
